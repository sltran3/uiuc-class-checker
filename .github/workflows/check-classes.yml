name: Check classes

on:
  schedule:
    # every 5 minutes, offset to :02, :07, :12, ... :57 so it never lands on the busy
    # :00/:15/:30/:45 marks (GitHub may still run it a few minutes late when it's busy)
    - cron: "2-59/5 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

# never run two checks at once
concurrency:
  group: check-classes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # remember which sections we've already notified about between runs
      - name: Restore notification state
        uses: actions/cache/restore@v6
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
          restore-keys: notified-

      - name: Check Course Explorer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py --once

      - name: Save notification state
        uses: actions/cache/save@v6
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
